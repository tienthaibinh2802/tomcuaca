h1{margin:0;font-size:clamp(20px,5vw,30px);letter-spacing:1px;text-align:center}
.table{width:100%;max-width:560px;background:var(--card);border:3px solid var(--acc);border-radius:20px;padding:30px 10px 20px;display:flex;flex-direction:column;align-items:center;gap:16px}
.stage{display:flex;justify-content:center;gap:clamp(14px,5vw,44px);height:190px;align-items:flex-end;perspective:800px;width:100%}

.tosser{position:absolute;inset:0}
.cube{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.7s cubic-bezier(.2,.7,.25,1)}
.f{position:absolute;inset:0;background-size:cover;background-position:center;border:2px solid #fff3d6;border-radius:10px;backface-visibility:hidden;box-shadow:inset 0 0 10px rgba(0,0,0,.2)}
.f0{transform:rotateY(0) translateZ(calc(var(--s)/2))}
.f1{transform:rotateY(90deg) translateZ(calc(var(--s)/2))}
.f2{transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.f3{transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
.f4{transform:rotateX(90deg) translateZ(calc(var(--s)/2))}
.f5{transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
.shadow{position:absolute;left:10%;right:10%;bottom:-14px;height:14px;border-radius:50%;background:rgba(0,0,0,.3);filter:blur(5px)}

button:active{transform:translateY(3px);box-shadow:0 2px 0 #7a0c10}button:disabled{opacity:.6;cursor:default}

html{background:var(--bg)}
#rot{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:9;font-size:14px;letter-spacing:0;padding:8px 14px;box-shadow:0 3px 0 #7a0c10;display:none}
html.rot body{position:fixed;top:0;left:100vw;width:100vh;height:100vw;min-height:0;transform-origin:top left;transform:rotate(90deg);overflow:auto;padding:10px;gap:8px;justify-content:center}
html.rot h1{font-size:15px}
html.rot .table{padding:14px 10px 12px;gap:8px;max-width:640px}
html.rot .stage{height:140px}
html.rot .slot{--s:84px}

// góc xoay để mặt i hướng ra trước
const ROT=[[0,0],[0,-90],[0,180],[0,90],[-90,0],[90,0]];
const stage=document.getElementById('stage'),res=document.getElementById('res'),btn=document.getElementById('btn');
const dice=[];
for(let d=0;d<3;d++){
  const slot=document.createElement('div');slot.className='slot';
  let faces='';for(let i=0;i<6;i++)faces+=`<div class="f f${i}" style="background-image:url(${IMG[i]})"></div>`;
  slot.innerHTML=`<div class="shadow"></div><div class="tosser"><div class="cube">${faces}</div></div>`;
  stage.appendChild(slot);
  const o={slot,tosser:slot.querySelector('.tosser'),cube:slot.querySelector('.cube'),kx:0,ky:0,v:d*2};
  dice.push(o);setCube(o,o.v,false);
}
function setCube(o,v,spin){
  if(spin){o.kx+=3+Math.floor(Math.random()*3);o.ky+=3+Math.floor(Math.random()*3);}
  o.cube.style.transform=`rotateX(${ROT[v][0]+360*o.kx}deg) rotateY(${ROT[v][1]+360*o.ky}deg)`;
}
btn.onclick=()=>{
  btn.disabled=true;res.textContent='Đang đổ...';
  dice.forEach((o,i)=>{
    o.v=Math.floor(Math.random()*6);
    setCube(o,o.v,true);
    const h=130+Math.random()*50,dx=(Math.random()-.5)*30;
    o.tosser.animate([
      {transform:'translate(0,0)',offset:0},
      {transform:`translate(${dx/2}px,${-h}px)`,offset:.35,easing:'cubic-bezier(.5,0,.9,.6)'},
      {transform:`translate(${dx}px,0)`,offset:.65},
      {transform:`translate(${dx}px,${-h*.25}px)`,offset:.78,easing:'cubic-bezier(.5,0,.9,.6)'},
      {transform:`translate(${dx}px,0)`,offset:.9},
      {transform:`translate(${dx}px,${-h*.06}px)`,offset:.95},
      {transform:`translate(${dx}px,0)`,offset:1}
    ],{duration:1700+i*120,fill:'forwards'});
  });
  setTimeout(()=>{res.textContent='Kết quả: '+dice.map(o=>NAMES[o.v]).join(' – ');btn.disabled=false;},2000);
};

const root=document.documentElement,rb=document.getElementById('rot');
const portrait=()=>innerHeight>innerWidth;
function sync(){
  if(!portrait())root.classList.remove('rot');
  rb.style.display=(portrait()||root.classList.contains('rot'))?'block':'none';
  rb.textContent=root.classList.contains('rot')?'⟲ Xoay lại':'⟳ Xoay ngang';
}
rb.onclick=async()=>{
  if(root.classList.contains('rot')){root.classList.remove('rot');sync();return;}
  try{await root.requestFullscreen();await screen.orientation.lock('landscape');}catch(e){}
  setTimeout(()=>{if(portrait())root.classList.add('rot');sync();},250);
};
addEventListener('resize',sync);addEventListener('orientationchange',sync);sync();
</script></body></html>
